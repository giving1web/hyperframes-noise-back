<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Static Sand Noise Background</title>
  <link rel="stylesheet" href="./noise-background.css" />
  <style>
    html,body{min-height:100%;margin:0;background:#070707;color:#f5f2ea;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;min-height:100vh}
    main{position:relative;z-index:1;width:min(860px,calc(100% - 48px));padding:72px 0}
    h1{font-size:clamp(42px,7vw,92px);letter-spacing:-.055em;line-height:.94;margin:0 0 28px}
    p{max-width:640px;font-size:clamp(16px,2vw,22px);line-height:1.8;color:rgba(245,242,234,.72)}
    .glass{margin-top:40px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035);backdrop-filter:blur(14px);padding:24px;border-radius:18px}
  </style>
</head>
<body>
  <div class="hf-noise-back" aria-hidden="true">
    <canvas class="hf-noise-back__canvas"></canvas>
  </div>

  <main>
    <h1>Analog noise.<br>Quietly alive.</h1>
    <p>サイトのコンテンツを邪魔しない、砂嵐のような微細ノイズ背景。強さはCSS変数で調整できます。</p>
    <div class="glass">このカードの後ろでノイズが動きます。</div>
  </main>

  <script src="./noise-background.js"></script>
</body>
</html>
