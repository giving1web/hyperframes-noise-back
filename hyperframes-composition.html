<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
</head>
<body style="margin:0;overflow:hidden;background:#070707">
  <div data-composition-id="static-sand-noise" data-width="1920" data-height="1080" style="position:relative;width:100vw;height:100vh;overflow:hidden;background:#070707">
    <div id="noise-layer" data-start="0" data-duration="12" data-track-index="0" style="position:absolute;inset:-6%;opacity:.36;overflow:hidden">
      <canvas id="noise" width="420" height="236" style="width:112%;height:112%;filter:contrast(1.08);transform:scale(1.03)"></canvas>
    </div>
    <div id="scan" data-start="0" data-duration="12" data-track-index="1" style="position:absolute;inset:0;opacity:.24;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0,rgba(255,255,255,.015) 1px,transparent 1px,transparent 4px)"></div>
    <div id="vig" data-start="0" data-duration="12" data-track-index="2" style="position:absolute;inset:0;background:radial-gradient(circle at center,transparent 38%,rgba(0,0,0,.72) 100%)"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      // Seeded deterministic grain for HyperFrames capture.
      let seed = 0x6d2b79f5;
      function rand(){
        seed += 0x6d2b79f5;
        let t=seed;
        t=Math.imul(t^(t>>>15),t|1);
        t^=t+Math.imul(t^(t>>>7),t|61);
        return ((t^(t>>>14))>>>0)/4294967296;
      }

      const c=document.getElementById('noise');
      const x=c.getContext('2d');
      const im=x.createImageData(c.width,c.height);
      for(let i=0;i<im.data.length;i+=4){
        const n=rand();
        const hot=n>.986?1:0;
        const v=130+Math.floor(n*94)+hot*26;
        im.data[i]=Math.min(245,v+4);
        im.data[i+1]=Math.min(240,v);
        im.data[i+2]=Math.min(230,v-8);
        im.data[i+3]=Math.floor(24+n*74+hot*74);
      }
      x.putImageData(im,0,0);

      const duration=12;
      const tl=gsap.timeline({paused:true});
      tl.fromTo('#noise-layer',{x:-18,y:-2},{x:18,y:3,duration:duration,ease:'none'},0);
      tl.fromTo('#noise',{opacity:.28},{opacity:.42,duration:1.2,ease:'sine.inOut',repeat:9,yoyo:true},0);
      tl.fromTo('#scan',{y:-3},{y:3,duration:2,ease:'none',repeat:5,yoyo:true},0);
      window.__timelines['static-sand-noise']=tl;
    </script>
  </div>
</body>
</html>
